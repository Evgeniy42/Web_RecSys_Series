services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: recsys_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recsys_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recsys_password}
      POSTGRES_DB: ${POSTGRES_DB:-recsys_series}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-recsys_user} -d $${POSTGRES_DB:-recsys_series}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - recsys_network

  # ─── FastAPI-приложение ────────────────────────────────────────────────
  app:
    build: .
    container_name: recsys_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-recsys_user}:${POSTGRES_PASSWORD:-recsys_password}@db:5432/${POSTGRES_DB:-recsys_series}
    ports:
      - "8000:8000"
    volumes:
      - avatars_data:/app/frontend/static/images/users_avatars
    networks:
      - recsys_network

volumes:
  postgres_data:
  avatars_data:

networks:
  recsys_network:
    driver: bridge
